  - rule: em-dash
    rule-version: '1'
    file: .github/workflows/audit.yaml
    phrase: '# Daily schedule — adjust cron expression per repo if a different cadence is desired.'
    ground: must match its package template byte for byte, as __tests__/dogfooded-workflows.app.unit.test.ts asserts; the template is outside this sweep
