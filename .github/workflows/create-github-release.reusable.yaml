# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: 'Reusable: Create GitHub Release'

# Reusable GitHub Release creation workflow for projects using @williamthorsen/release-kit.
#
# Triggered by tag pushes (or any caller-defined event). Runs
# `release-kit create-github-release --tags <tag>` through `pnpm exec`, so the
# consumer must carry `@williamthorsen/release-kit` as a root dependency, where
# `pnpm exec` resolves it. Independent of publishing: consumers that do not
# publish to npm can still use this workflow.
# Releases whose changelog has no all-audience content (e.g., tooling-only)
# succeed silently — the workflow does not fail.
# When running in the `williamthorsen/node-monorepo-tools` repo itself (checked
# via `github.repository`), release-kit is additionally built from source so
# the workspace-linked binary is ready.
# The calling workflow must grant `contents: write` permission so `gh release create` can run.
#
# Consumer prerequisite: a `devEngines.packageManager` or `packageManager` field
# pinning pnpm 11 or newer, which is the range `pnpm/setup` installs.
#
# Usage:
#   jobs:
#     create-github-release:
#       uses: williamthorsen/node-monorepo-tools/.github/workflows/create-github-release.reusable.yaml@workflow/create-github-release-v1
#       with:
#         tag: ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      tag:
        description: 'Full tag name to create the GitHub Release for (e.g., my-pkg-v1.2.3)'
        required: true
        type: string
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '24'

permissions:
  contents: write

jobs:
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ inputs.node-version }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build release-kit from source to avoid bootstrap problems when
      # consumers tag a version that introduces new CLI flags.
      - name: Build release-kit from source
        if: ${{ github.repository == 'williamthorsen/node-monorepo-tools' }}
        run: pnpm --filter @williamthorsen/release-kit... run prepare

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec release-kit create-github-release --tags "${{ inputs.tag }}"
