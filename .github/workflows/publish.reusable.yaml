# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: 'Reusable: Publish'

# Reusable publish workflow for projects using @williamthorsen/release-kit.
#
# Triggered by tag pushes. Runs `pnpm install` before publishing so consumer
# packages with build-time `prepare` hooks have their devDependencies on disk,
# then invokes release-kit through `pnpm exec`, so the consumer must carry
# `@williamthorsen/release-kit` as a root dependency, where `pnpm exec` resolves
# it. release-kit shells out to `pnpm publish`, and pnpm performs the npm OIDC
# token exchange itself, so no `.npmrc` is written and no registry URL is
# configured.
# When running in the `williamthorsen/node-monorepo-tools` repo itself (checked
# via `github.repository`), release-kit is additionally built from source so
# the workspace-linked binary is ready before `pnpm exec` invokes it.
# The calling workflow must grant `id-token: write` and `contents: read` permissions.
#
# Consumer prerequisite: a `devEngines.packageManager` or `packageManager` field
# pinning pnpm 11 or newer, which is the range `pnpm/setup` installs.
#
# Usage:
#   jobs:
#     publish:
#       uses: williamthorsen/node-monorepo-tools/.github/workflows/publish.reusable.yaml@workflow/publish-v1

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use for publishing'
        required: false
        type: string
        default: '24'
      provenance:
        description: 'Generate npm provenance attestations (requires a public repo)'
        required: false
        type: boolean
        default: false
      tags:
        description: 'Comma-separated list of full tag names to publish (leave empty to publish every release tag on HEAD)'
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ inputs.node-version }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run the release-kit being published, whose CLI flags the published version may lack.
      - name: Build release-kit from source
        if: ${{ github.repository == 'williamthorsen/node-monorepo-tools' }}
        run: pnpm --filter @williamthorsen/release-kit... run prepare

      - name: Publish
        run: |
          pnpm exec release-kit publish \
            ${{ inputs.provenance && '--provenance' || '' }} \
            ${{ inputs.tags != '' && format('--tags="{0}"', inputs.tags) || '' }}
