# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: 'Reusable: Publish'

# Reusable publish workflow for projects using @williamthorsen/release-kit.
#
# Called from a tag push to publish, or with `dry-run: true` from a `pull_request` trigger to check the publish setup
# without publishing. Runs `pnpm install` before publishing so that consumer packages with build-time `prepare` hooks
# have their devDependencies on disk, then invokes release-kit through `pnpm exec`. Because `pnpm exec` resolves
# release-kit from the repository root, the consumer must declare `@williamthorsen/release-kit` as a root dependency.
# release-kit shells out to `pnpm publish`, and pnpm performs the npm OIDC token exchange itself, so the workflow does
# not write an `.npmrc` or configure a registry URL. When running in the `williamthorsen/node-monorepo-tools` repo
# itself (checked via `github.repository`), release-kit is additionally built from source so that the workspace-linked
# binary is ready before `pnpm exec` invokes it. After publishing, release-kit waits until the registry lists each
# published version, and fails when one does not appear within its timeout. A dry run previews every publishable package
# when HEAD does not have any release tags, as on a pull request; both behaviors need a consumer's release-kit to be
# recent enough to have them. When a publish that is not a dry run fails, the `notify-failure` job opens an issue
# labelled `publish-failure` in the calling repository, or comments on the open one whose title names the same tags,
# creating the label when it is missing. The calling workflow must grant `id-token: write`, `contents: read`, and
# `issues: write` permissions, for a dry run as well; only the notification job holds `issues: write`. A pull request
# from a fork does not receive `id-token: write`, so a dry run cannot run on one.
#
# Consumer prerequisites: a `nodejs` entry in `.tool-versions`, which names the
# Node.js version to install unless the `node-version` input overrides it, and a
# `devEngines.packageManager` or `packageManager` field pinning pnpm 11 or newer,
# which is the range that `pnpm/setup` installs.
#
# Usage:
#   jobs:
#     publish:
#       uses: williamthorsen/node-monorepo-tools/.github/workflows/publish.reusable.yaml@workflow/publish-v2
#
#   # In a workflow triggered by `pull_request`:
#   jobs:
#     publish-dry-run:
#       uses: williamthorsen/node-monorepo-tools/.github/workflows/publish.reusable.yaml@workflow/publish-v2
#       with:
#         dry-run: true

on:
  workflow_call:
    inputs:
      dry-run:
        description: 'Run `release-kit publish --dry-run`, which packs every package without publishing it'
        required: false
        type: boolean
        default: false
      node-version:
        description: 'Node.js version to install in place of the one that `.tool-versions` pins'
        required: false
        type: string
        default: ''
      provenance:
        description: 'Generate npm provenance attestations (requires a public repo)'
        required: false
        type: boolean
        default: false
      tags:
        description: 'Comma-separated list of full tag names to publish (leave empty to
          publish every release tag on HEAD)'
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish
    # npm generates provenance only on GitHub-hosted runners, so this job ignores `CI_RUNS_ON`.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node${{ inputs.node-version != '' && format('@{0}', inputs.node-version) || '' }}
          node-version-file: .tool-versions
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run the release-kit being published, whose CLI flags the published version may lack.
      - name: Build release-kit from source
        if: ${{ github.repository == 'williamthorsen/node-monorepo-tools' }}
        run: pnpm --filter @williamthorsen/release-kit... run prepare

      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          PROVENANCE: ${{ inputs.provenance }}
          TAGS: ${{ inputs.tags }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=("--dry-run")
          fi
          if [ "$PROVENANCE" = "true" ]; then
            args+=("--provenance")
          fi
          if [ -n "$TAGS" ]; then
            args+=("--tags=$TAGS")
          fi
          pnpm exec release-kit publish "${args[@]}"

  notify-failure:
    name: Report publish failure
    needs: publish
    if: ${{ failure() && !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Open or update the publish-failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          SHA: ${{ github.sha }}
          TAGS: ${{ inputs.tags }}
        with:
          script: |
            const label = 'publish-failure';
            const { RUN_URL: runUrl, SHA: sha, TAGS: tagsInput } = process.env;
            const tags = (tagsInput ?? '').split(',').map((tag) => tag.trim()).filter((tag) => tag !== '');
            const title =
              tags.length > 0 ? `Publish failed: ${tags.join(', ')}` : `Publish failed: release tags on ${sha.slice(0, 7)}`;

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name: label,
                  color: 'b60205',
                  description: "A release's publish run failed",
                });
              } catch (createError) {
                // A concurrent run that created the label first leaves it in place.
                if (createError.status !== 422) throw createError;
              }
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.pull_request === undefined && issue.title === title);

            if (existing === undefined) {
              const { data } = await github.rest.issues.create({
                ...context.repo,
                title,
                labels: [label],
                body: [
                  'The Publish workflow failed, so these packages may not be on npm.',
                  '',
                  `Run: ${runUrl}`,
                  '',
                  'Close this issue once the packages are published.',
                ].join('\n'),
              });
              core.info(`Opened #${data.number}: ${title}`);
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `Publish failed again: ${runUrl}`,
              });
              core.info(`Commented on #${existing.number}: ${title}`);
            }
