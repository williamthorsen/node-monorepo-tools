# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: 'Reusable: Release'

# Reusable release workflow for projects using @williamthorsen/release-kit.
#
# Installs `@williamthorsen/release-kit` globally and runs `release-kit prepare` to bump versions and generate
# changelogs. The CLI writes computed tag names to `tmp/.release-tags` (relative to the project root).
# This workflow reads that file, so `tagPrefix` in the release config is the single source of truth for tag names.
#
# On the consumer path, project dependencies are not installed: release-kit runs git-cliff and prettier via `npx`,
# so the job does not need a local node_modules. The source-build path installs them.
#
# When running in the `williamthorsen/node-monorepo-tools` repo, the workflow builds release-kit from source.
#
# Usage:
#   jobs:
#     release:
#       uses: williamthorsen/node-monorepo-tools/.github/workflows/release.reusable.yaml@workflow/release-v1

on:
  workflow_call:
    inputs:
      prepare-command:
        description: 'Command to run for release preparation (override for repos that
          need custom logic)'
        type: string
        default: 'release-kit prepare'
      only:
        description: 'Workspaces to release, with their dependents (comma-separated, monorepo only)'
        type: string
        default: ''
      bump:
        description: 'Override version bump type'
        type: string
        default: ''
      force:
        description: 'Force a release even when there are not any commits, or any
          bump-worthy commits, since the last release (defaults to patch; combine with --bump for a different level)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BUILD_LOCAL: ${{ github.repository == 'williamthorsen/node-monorepo-tools' }}
      GITHUB_TOKEN: ${{ github.token }}
      # Keeps Corepack shims from refusing `npm` and `npx` on the source-build path, which leaves the pnpm
      # `packageManager` pin in place.
      COREPACK_ENABLE_STRICT: '0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      # Strip the packageManager field so that actions/setup-node does not try to install it.
      # The field is irrelevant for release preparation.
      - name: Neutralize packageManager field
        if: ${{ env.BUILD_LOCAL != 'true' }}
        run: node -e "const
          fs=require('fs'),f='package.json',p=JSON.parse(fs.readFileSync(f));delete
          p.packageManager;fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      # `runtime` is omitted, so this step installs pnpm alone and the Node.js step below owns the runtime.
      # Because this step runs ahead of that one, the Node.js step still owns the runtime if this repo ever declares
      # `devEngines.runtime`.
      - name: Set up pnpm
        if: ${{ env.BUILD_LOCAL == 'true' }}
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      # `release-kit prepare` spawns `npx git-cliff` and `npx prettier`, and the consumer path installs release-kit with
      # `npm install --global`. `pnpm/setup` omits `npm` and `npx` from the runtime that it installs, so this step
      # supplies them at a version paired with the Node.js that they run under.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # npm 11 resolves the binaries of scoped packages unreliably through `npm exec` and `npx`. Install globally to put
      # the binary on PATH.
      - name: Install release-kit from npm
        if: ${{ env.BUILD_LOCAL != 'true' }}
        run: npm install --global @williamthorsen/release-kit

      # Run the release-kit being released, because its CLI may have flags that the published version lacks.
      - name: Install dependencies
        if: ${{ env.BUILD_LOCAL == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build release-kit from source
        if: ${{ env.BUILD_LOCAL == 'true' }}
        run: pnpm --filter @williamthorsen/release-kit... run prepare

      - name: Link release-kit onto PATH
        if: ${{ env.BUILD_LOCAL == 'true' }}
        run: npm link --workspace packages/release-kit

      - name: Run release preparation
        run: |
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then
            ARGS="$ARGS --only=${{ inputs.only }}"
          fi
          if [ -n "${{ inputs.bump }}" ]; then
            ARGS="$ARGS --bump=${{ inputs.bump }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          # `$ARGS` stays unquoted so that each flag reaches the command as its own argument.
          # shellcheck disable=SC2086
          ${{ inputs.prepare-command }} $ARGS

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No release-worthy changes found."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine tags
        if: steps.check.outputs.changed == 'true'
        id: tags
        run: |
          TAGS_FILE="tmp/.release-tags"
          if [ ! -f "$TAGS_FILE" ]; then
            echo "Error: $TAGS_FILE not found" >&2
            exit 1
          fi
          TAGS=$(tr '\n' ' ' < "$TAGS_FILE" | xargs)
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Releasing: $TAGS"

      - name: Commit, tag, and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          release-kit commit
          release-kit tag --no-git-checks

          git push origin HEAD
          for tag in ${{ steps.tags.outputs.tags }}; do
            git push --no-follow-tags origin "$tag"
          done
