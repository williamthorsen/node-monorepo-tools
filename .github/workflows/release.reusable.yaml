# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: 'Reusable: Release'

# Reusable release workflow for projects using @williamthorsen/release-kit.
#
# Installs the project's dependencies, puts `node_modules/.bin` on PATH, and runs `release-kit prepare` to bump
# versions and generate changelogs. Every `release-kit` call, a custom `prepare-command` included, therefore runs the
# project's own release-kit, which can resolve the `@williamthorsen/release-kit/config` import of the release config.
# The CLI writes computed tag names to `tmp/.release-tags` (relative to the project root). This workflow reads that
# file, so `tagPrefix` in the release config is the single source of truth for tag names.
#
# When running in the `williamthorsen/node-monorepo-tools` repo, the workflow builds release-kit from source.
#
# A tag push made with `GITHUB_TOKEN` does not start any workflow, so after pushing, the `start-tag-workflows` job
# dispatches `publish.yaml` and `create-github-release.yaml` at each new tag. It skips a workflow that the repo does not
# contain at the tag, and fails when GitHub refuses a dispatch, as it does for a workflow without a `workflow_dispatch`
# trigger.
#
# Consumer prerequisites: a `nodejs` entry in `.tool-versions`, which names the Node.js version to install;
# `@williamthorsen/release-kit` as a root dependency; a `devEngines.packageManager` or `packageManager` field pinning
# pnpm 11 or newer, which is the range that `pnpm/setup` installs; a committed `pnpm-lock.yaml`; a caller that grants
# `actions: write` alongside `contents: write` and `packages: read`; and a `workflow_dispatch` trigger in
# `publish.yaml` and `create-github-release.yaml`. The workflows that `release-kit init` scaffolds meet the last two.
#
# Runner: the caller's `CI_RUNS_ON` variable selects the runner of every job,
# defaulting to `ubuntu-latest`; see "Runner selection" in the workflows README.
#
# Usage:
#   jobs:
#     release:
#       uses: williamthorsen/node-monorepo-tools/.github/workflows/release.reusable.yaml@workflow/release-v2

on:
  workflow_call:
    inputs:
      prepare-command:
        description: 'Command to run for release preparation (override for repos that
          need custom logic)'
        type: string
        default: 'release-kit prepare'
      only:
        description: 'Release targets to release, with their dependents (comma-separated, monorepo only)'
        type: string
        default: ''
      bump:
        description: 'Override version bump type'
        type: string
        default: ''
      force:
        description: 'Force a release even when there are not any commits, or any
          bump-worthy commits, since the last release (defaults to patch; combine with --bump for a different level)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    runs-on: ${{ fromJSON((startsWith(vars.CI_RUNS_ON || 'ubuntu-latest', '[') || startsWith(vars.CI_RUNS_ON || 'ubuntu-latest', '{') || startsWith(vars.CI_RUNS_ON || 'ubuntu-latest', '"')) && (vars.CI_RUNS_ON || 'ubuntu-latest') || toJSON(vars.CI_RUNS_ON || 'ubuntu-latest')) }}
    timeout-minutes: 15
    outputs:
      tags: ${{ steps.tags.outputs.tags }}

    env:
      BUILD_LOCAL: ${{ github.repository == 'williamthorsen/node-monorepo-tools' }}
      GITHUB_TOKEN: ${{ github.token }}
      # Keeps Corepack shims from refusing `npm` and `npx` in a repo whose `packageManager` field pins pnpm.
      COREPACK_ENABLE_STRICT: '0'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      # Installs pnpm and leaves the runtime to the Node.js step below: `runtime` is omitted, and `node-version-file:
      # false` keeps `pnpm/setup` from installing the Node.js version declared in `.tool-versions`. Because this step
      # runs ahead of that one, the Node.js step still owns the runtime if the repo ever declares `devEngines.runtime`.
      - name: Set up pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          install: false
          node-version-file: false

      # `release-kit prepare` spawns `npx prettier`, and `pnpm/setup` omits `npm` and `npx` from the runtime that it
      # installs, so this step supplies them at a version paired with the Node.js that they run under.
      # `package-manager-cache: false` keeps the step from acting on the caller's `packageManager` field, which stays
      # untouched because `release-kit commit` stages every change in the working tree.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run the release-kit being released, because its CLI may have flags that the published version lacks.
      - name: Build release-kit from source
        if: ${{ env.BUILD_LOCAL == 'true' }}
        run: pnpm --filter @williamthorsen/release-kit... run prepare

      - name: Put the project's binaries on PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      # `inputs.prepare-command` is a command by design, so it alone is substituted into the script.
      - name: Run release preparation
        env:
          ONLY: ${{ inputs.only }}
          BUMP: ${{ inputs.bump }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "$ONLY" ]; then
            args+=("--only=$ONLY")
          fi
          if [ -n "$BUMP" ]; then
            args+=("--bump=$BUMP")
          fi
          if [ "$FORCE" = "true" ]; then
            args+=("--force")
          fi
          ${{ inputs.prepare-command }} "${args[@]}"

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No release-worthy changes found."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine tags
        if: steps.check.outputs.changed == 'true'
        id: tags
        run: |
          TAGS_FILE="tmp/.release-tags"
          if [ ! -f "$TAGS_FILE" ]; then
            echo "Error: $TAGS_FILE not found" >&2
            exit 1
          fi
          TAGS=$(tr '\n' ' ' < "$TAGS_FILE" | xargs)
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Releasing: $TAGS"

      - name: Commit, tag, and push
        if: steps.check.outputs.changed == 'true'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          release-kit commit
          release-kit tag --no-git-checks

          git push origin HEAD
          read -ra tags <<<"$TAGS"
          for tag in "${tags[@]}"; do
            git push --no-follow-tags origin "$tag"
          done

  start-tag-workflows:
    name: Start tag workflows
    needs: release
    if: ${{ needs.release.outputs.tags != '' }}
    runs-on: ${{ fromJSON((startsWith(vars.CI_RUNS_ON || 'ubuntu-latest', '[') || startsWith(vars.CI_RUNS_ON || 'ubuntu-latest', '{') || startsWith(vars.CI_RUNS_ON || 'ubuntu-latest', '"')) && (vars.CI_RUNS_ON || 'ubuntu-latest') || toJSON(vars.CI_RUNS_ON || 'ubuntu-latest')) }}
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read

    steps:
      # A push made with `GITHUB_TOKEN` does not start any workflow, but a dispatch does, so each tag workflow is
      # dispatched at the tag. A 404 means that the repo does not contain the workflow at the tag; any other failure of
      # the lookup or the dispatch fails the job after every other dispatch is attempted.
      - name: Dispatch the tag workflows at each tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.release.outputs.tags }}
        run: |
          workflows=(publish.yaml create-github-release.yaml)
          failed=0
          read -ra tags <<<"$TAGS"
          for tag in "${tags[@]}"; do
            for workflow in "${workflows[@]}"; do
              if ! lookup_error=$(gh api --silent "repos/$GITHUB_REPOSITORY/contents/.github/workflows/$workflow?ref=$tag" 2>&1); then
                if [[ "$lookup_error" == *"HTTP 404"* ]]; then
                  echo "::notice::Skipping $workflow at $tag: the repo does not contain it at that tag."
                else
                  echo "::error::Could not look up $workflow at $tag: $lookup_error"
                  failed=1
                fi
                continue
              fi

              if gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$tag"; then
                echo "Dispatched $workflow at $tag."
              else
                echo "::error::GitHub refused to dispatch $workflow at $tag. A workflow scaffolded by an older release-kit lacks a workflow_dispatch trigger; run \`release-kit update-templates\` and commit the result."
                failed=1
              fi
            done
          done
          exit "$failed"
