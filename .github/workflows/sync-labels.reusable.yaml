# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: 'Reusable: Sync labels'

# Reusable label-sync workflow for repos consuming release-kit's `sync-labels`.
#
# Applies `.github/labels.yaml` to the repository's labels, then archives each label that the file marks
# `archived: true` and unarchives each archived label that it declares without the mark.
# An archived label stays on the issues and pull requests that have it.
# A label that the file does not declare stays in place, and the run reports it as a warning.
# Pass `dry-run: true` to compute and log the diff without applying it; the job log then contains the full set of
# creates, edits, and renames, every pending archive and unarchive, and every undeclared label.
#
# Runner: the caller's `CI_RUNS_ON` variable selects the runner of every job,
# defaulting to `ubuntu-latest`; see "Runner selection" in the workflows README.
#
# Usage:
#   jobs:
#     sync:
#       uses: williamthorsen/node-monorepo-tools/.github/workflows/sync-labels.reusable.yaml@workflow/sync-labels-v1
#       with:
#         dry-run: true

on:
  workflow_call:
    inputs:
      dry-run:
        description: Compute and log the label diff without applying it
        type: boolean
        required: false
        default: false

# Permissions are declared by the caller.

jobs:
  sync:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The engine's label schema rejects keys that it does not know, so it reads a copy without the archived mark.
      - name: Prepare label files
        run: |
          yq 'map(del(.archived))' .github/labels.yaml > "$RUNNER_TEMP/labels.engine.yaml"
          yq --output-format=json '.' .github/labels.yaml > "$RUNNER_TEMP/labels.json"
      # Pinned by commit SHA: the action's `main` swaps the vendored engine for `@endbug/github-label-sync@3`,
      # whose rename semantics and handling of undeclared labels differ from the ones on which this step relies.
      #
      # Engine verified for v2.3.3: vendors github-label-sync@2.3.1.
      # Dependabot maintains the trailing comment only while it contains the version alone, and rewrites it in step
      # with the SHA; this line does not move with it, so a bump fails the pin guard until the engine is re-verified
      # against the new release's lockfile.
      - name: Sync labels
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          config-file: ${{ runner.temp }}/labels.engine.yaml
          delete-other-labels: false
          dry-run: ${{ inputs.dry-run }}
      # Runs after the engine, so that a marked label which the engine has just created exists to be archived.
      # The engine reads archived labels like any other, so it does not recreate a declared one.
      - name: Reconcile archive state
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          LABELS_FILE: ${{ runner.temp }}/labels.json
        with:
          script: |
            const declaredLabels = JSON.parse(require('fs').readFileSync(process.env.LABELS_FILE, 'utf8'));
            const isDryRun = process.env.DRY_RUN === 'true';
            const repoLabels = await github.paginate('GET /repos/{owner}/{repo}/labels', {
              ...context.repo,
              per_page: 100,
            });
            const repoLabelsByKey = new Map(repoLabels.map((label) => [label.name.toLowerCase(), label]));

            core.startGroup('Archive state');
            let changeCount = 0;
            for (const declared of declaredLabels) {
              const isMarked = declared.archived === true;
              const repoLabel = repoLabelsByKey.get(declared.name.toLowerCase());
              if (repoLabel === undefined) {
                if (!isMarked) continue;
                changeCount += 1;
                if (isDryRun) {
                  core.info(`Would archive ${declared.name} after creating it`);
                } else {
                  core.setFailed(`${declared.name} is marked as archived, but the repository does not have it`);
                }
                continue;
              }

              const isArchived = repoLabel.archived_at !== null && repoLabel.archived_at !== undefined;
              if (isMarked === isArchived) continue;
              changeCount += 1;
              const action = isMarked ? 'archive' : 'unarchive';
              if (isDryRun) {
                core.info(`Would ${action} ${declared.name}`);
                continue;
              }
              try {
                await github.request('PATCH /repos/{owner}/{repo}/labels/{name}', {
                  ...context.repo,
                  name: repoLabel.name,
                  archived: isMarked,
                });
                core.info(`${isMarked ? 'Archived' : 'Unarchived'} ${declared.name}`);
              } catch (error) {
                core.setFailed(`Failed to ${action} ${declared.name}: ${error.message}`);
              }
            }
            if (changeCount === 0) {
              core.info('Every declared label is already in its declared archive state.');
            }
            core.endGroup();
      # The engine leaves a label that the file does not declare in place and omits it from its diff.
      - name: Report undeclared labels
        uses: actions/github-script@v9
        env:
          LABELS_FILE: ${{ runner.temp }}/labels.json
        with:
          script: |
            const declaredLabels = JSON.parse(require('fs').readFileSync(process.env.LABELS_FILE, 'utf8'));
            // The engine renames a label that a declared label names in `aliases`.
            const declaredKeys = new Set(
              declaredLabels.flatMap((label) => [label.name, ...(label.aliases ?? [])]).map((name) => name.toLowerCase()),
            );
            const repoLabels = await github.paginate('GET /repos/{owner}/{repo}/labels', {
              ...context.repo,
              per_page: 100,
            });

            core.startGroup('Undeclared labels');
            const undeclaredLabels = repoLabels.filter((label) => !declaredKeys.has(label.name.toLowerCase()));
            for (const label of undeclaredLabels) {
              core.warning(`${label.name} is not declared by .github/labels.yaml; declare it, or delete it from the repository`);
            }
            if (undeclaredLabels.length === 0) {
              core.info('Every repository label is declared.');
            }
            core.endGroup();
