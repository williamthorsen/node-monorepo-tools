# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Workflow pointer drift

# Fails when a `workflow/*` pointer tag lags main's newest commit touching its reusable workflow. A failed scheduled run
# notifies the maintainer who last edited the cron line. Holds live in `.config/workflow-pointer-holds.json`.
on:
  schedule:
    - cron: '0 9 * * *'

  # Re-run after moving a tag to confirm that the drift is cleared.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Check pointer tags
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Full history and every tag, so that each tag's ancestry can be compared with main.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Report drifted pointer tags
        run: node scripts/check-workflow-pointer-drift.ts origin/main
