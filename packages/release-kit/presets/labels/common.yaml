# Common label definitions for GitHub repositories.
# Compatible with EndBug/label-sync format.
# Work-type labels are built from change-grammar's taxonomy in src/sync-labels/typeLabels.ts.

# Main categories
- name: breaking
  color: b60205
  description: Breaking API change or removal of functionality
- name: bug
  color: d73a4a
  description: "Something isn't working"
- name: operational
  color: '000000'
  description: Actions outside the codebase
- name: spike
  color: '000000'
  description: Investigation

# Guidance
- name: good first issue
  color: 90ee90
  description: Good for newcomers
- name: help wanted
  color: '008672'
  description: Please help if you can
- name: question
  color: fbca04
  description: Further information is needed

# Priority
- name: 'priority:critical'
  color: b60205
- name: 'priority:high'
  color: d93f0b
- name: 'priority:medium'
  color: fbca04
- name: 'priority:low'
  color: cfd3d7

# Status
- name: 'status:blocked'
  color: b83280
- name: 'status:on-hold'
  color: fbcfe8

# Value
- name: 'value:must-have'
  color: 7057ff
- name: 'value:should-have'
  color: 8d83fc
- name: 'value:nice-to-have'
  color: a8b2f8
- name: 'value:questionable'
  color: c5def5

# Triage
- name: duplicate
  color: cfd3d7
  description: Duplicates another issue or pull request
- name: wontfix
  color: ffffff
  description: This will not be worked on
