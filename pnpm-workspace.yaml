packages:
  - packages/*

catalog:
  '@williamthorsen/toolbelt.errors': 0.7.0
  '@williamthorsen/toolbelt.filesystem': 0.8.3
  '@williamthorsen/toolbelt.testing': 0.5.1
  '@williamthorsen/toolbelt.vitest': 0.9.0
  esbuild: ^0.28.2
  'readyup': 0.36.0
  vitest: 4.1.11

allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: true

# Keep pnpm 11's 24h minimumReleaseAge soak (supply-chain protection), set
# explicitly to pin the policy, but exclude first-party packages so a freshly
# published version can be consumed downstream without waiting out the soak.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@williamthorsen/*'
  - codeassembly
  - codeassembly-lifecycle
  - readyup
  - v11y-check

savePrefix: ''
