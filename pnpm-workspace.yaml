packages:
  - packages/*

catalog:
  '@williamthorsen/toolbelt.errors': 0.8.2
  '@williamthorsen/toolbelt.filesystem': 0.9.2
  '@williamthorsen/toolbelt.terminal': 0.2.1
  '@williamthorsen/toolbelt.testing': 0.6.2
  '@williamthorsen/toolbelt.vitest': 0.10.2
  esbuild: 0.28.2
  prettier: 3.9.9
  readyup: 0.40.0
  vitest: 4.1.11
  yaml: 2.9.1

allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: true

# Keep pnpm 11's 24h minimumReleaseAge soak (supply-chain protection), set
# explicitly to pin the policy, but exclude first-party packages so that a
# freshly published version can be consumed downstream without waiting out
# the soak.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@williamthorsen/*'
  - codeassembly
  - codeassembly-lifecycle
  - readyup
  - v11y-check

savePrefix: ''
