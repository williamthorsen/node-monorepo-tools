packages:
  - packages/*

catalog:
  '@williamthorsen/toolbelt.datetime': 4.1.0
  '@williamthorsen/toolbelt.errors': 0.9.0
  '@williamthorsen/toolbelt.filesystem': 0.10.0
  '@williamthorsen/toolbelt.packaging': 0.7.0
  '@williamthorsen/toolbelt.terminal': 0.3.0
  '@williamthorsen/toolbelt.testing': 0.8.0
  '@williamthorsen/toolbelt.vitest': 0.13.1
  esbuild: 0.28.2
  prettier: 3.9.10
  readyup: 0.44.0
  vitest: 5.0.5
  yaml: 2.9.1

allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: true

# Keep pnpm 11's 24h minimumReleaseAge soak (supply-chain protection), set
# explicitly to pin the policy, but exclude first-party packages so that a
# freshly published version can be consumed downstream without waiting out
# the soak.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@williamthorsen/*'
  - codeassembly
  - codeassembly-lifecycle
  - readyup
  - v11y-check

# Refuse a release whose provenance is weaker than that of an earlier release of the same package,
# which can signal a compromised publisher.
trustPolicy: no-downgrade
# semver@6.3.1 is a 2023 backport on the 6.x line, published without provenance after 7.x releases had
# it; eslint-plugin-react depends on it.
trustPolicyExclude:
  - 'semver@6.3.1'

savePrefix: ''
